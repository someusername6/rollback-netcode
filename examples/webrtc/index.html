<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Local Demo - Rollback Netcode</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #888;
    }
    .panel {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .info-label {
      color: #888;
    }
    .info-value {
      color: #3498db;
      font-family: monospace;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #3498db;
      color: #fff;
    }
    .btn-primary:hover {
      background: #2980b9;
    }
    .btn-secondary {
      background: #2ecc71;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #27ae60;
    }
    input {
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #333;
      border-radius: 4px;
      background: #252540;
      color: #e0e0e0;
      width: 100%;
    }
    input::placeholder {
      color: #666;
    }
    .join-row {
      display: flex;
      gap: 10px;
    }
    .join-row input {
      flex: 1;
    }
    .divider {
      text-align: center;
      color: #666;
      margin: 15px 0;
      font-size: 0.9rem;
    }
    #game-canvas {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #1a1a2e;
    }
    .hint {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WebRTC Local Demo</h1>

    <div class="panel">
      <div class="info-row">
        <span class="info-label">Your Peer ID:</span>
        <span class="info-value" id="peer-id">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Room:</span>
        <span class="info-value" id="room-id">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Status:</span>
        <span class="info-value" id="status">Not connected</span>
      </div>
    </div>

    <div class="panel">
      <div class="controls">
        <button class="btn btn-primary" id="create-btn">Create Room (Host)</button>
        <div class="divider">- or -</div>
        <div class="join-row">
          <input type="text" id="room-input" placeholder="Enter room ID">
          <button class="btn btn-secondary" id="join-btn">Join</button>
        </div>
      </div>
    </div>

    <canvas id="game-canvas" width="300" height="200"></canvas>
    <p class="hint">Use arrow keys or WASD to move</p>
  </div>

  <script type="module" src="client.js"></script>
</body>
</html>
